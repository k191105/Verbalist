<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbalist - Word List</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #F6F3E7;
            --bg-secondary: #FAEBD7;
            --accent-primary: #E3AF64;
            --accent-secondary: #516AC8;
            --accent-tertiary: #26428B;
            --text-dark: #0F1939;
            --text-gray: #8E8E93;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Crimson Pro', serif;
            background: #000;
        }

        .screen {
            width: 430px;
            height: 932px;
            margin: 20px auto;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        /* Header */
        .header {
            background: white;
            padding: 60px 20px 16px;
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.08);
        }

        .header-row {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .back-button {
            color: var(--accent-secondary);
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            padding-right: 12px;
        }

        .header-title {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
            color: var(--text-dark);
            flex: 1;
        }

        .done-button {
            color: var(--accent-secondary);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            gap: 24px;
            padding: 0 4px;
        }

        .tab {
            font-size: 17px;
            color: var(--text-gray);
            padding-bottom: 8px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--text-dark);
            border-bottom-color: var(--text-dark);
        }

        /* Content */
        .content {
            height: calc(932px - 165px);
            overflow-y: auto;
            padding: 20px;
        }

        /* List Header */
        .list-header {
            margin-bottom: 20px;
        }

        .list-name {
            font-family: 'DM Serif Display', serif;
            font-size: 24px;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .list-meta {
            font-size: 15px;
            color: var(--text-gray);
        }

        /* Search/Add Bar */
        .search-container {
            position: relative;
            margin-bottom: 24px;
        }

        .search-input {
            width: 100%;
            background: white;
            border: 1.5px solid rgba(0, 0, 0, 0.1);
            border-radius: 14px;
            padding: 12px 16px;
            font-family: 'Crimson Pro', serif;
            font-size: 17px;
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-secondary);
            background: rgba(255, 255, 255, 1);
        }

        .search-input::placeholder {
            color: var(--text-gray);
            opacity: 0.6;
        }

        .search-hint {
            font-size: 13px;
            color: var(--text-gray);
            margin-top: 6px;
            padding: 0 4px;
        }

        /* Sort Controls */
        .sort-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .sort-label {
            font-size: 13px;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .sort-buttons {
            display: flex;
            gap: 8px;
        }

        .sort-button {
            font-size: 15px;
            color: var(--accent-secondary);
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Crimson Pro', serif;
        }

        .sort-button.active {
            background: var(--accent-secondary);
            color: white;
            border-color: var(--accent-secondary);
        }

        .sort-button:hover:not(.active) {
            background: rgba(0, 0, 0, 0.02);
        }

        /* Word List */
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: white;
            border-radius: 14px;
            overflow: hidden;
        }

        .word-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: white;
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.08);
            transition: background 0.2s;
            cursor: pointer;
        }

        .word-item:last-child {
            border-bottom: none;
        }

        .word-item:active {
            background: rgba(0, 0, 0, 0.02);
        }

        /* Confidence Indicator */
        .confidence {
            display: flex;
            gap: 4px;
            margin-right: 14px;
        }

        .confidence-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(15, 25, 57, 0.15);
        }

        .confidence-dot.filled {
            background: var(--accent-secondary);
        }

        .confidence-dot.mastered {
            background: var(--accent-primary);
        }

        /* Word Text */
        .word-text {
            flex: 1;
            font-size: 17px;
            color: var(--text-dark);
        }

        .word-text.mastered {
            opacity: 0.6;
        }

        /* Priority Star */
        .priority-star {
            color: var(--accent-primary);
            font-size: 18px;
            margin-left: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .word-item.priority .priority-star {
            opacity: 1;
        }

        /* Mastered Checkmark */
        .checkmark {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            margin-left: 8px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 40px;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-text {
            font-family: 'DM Serif Display', serif;
            font-size: 20px;
            color: var(--text-gray);
            margin-bottom: 8px;
        }

        .empty-subtext {
            font-size: 15px;
            color: var(--text-gray);
            opacity: 0.8;
        }

        /* Section Headers */
        .section-header {
            font-size: 13px;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            padding: 16px 4px 8px;
        }
    </style>
</head>
<body>

<div class="screen">
    <!-- Header -->
    <div class="header">
        <div class="header-row">
            <div class="back-button">‹</div>
            <div class="header-title">Word Lists</div>
            <div class="done-button">Done</div>
        </div>
        <div class="tabs">
            <div class="tab active">Active</div>
            <div class="tab">Presets</div>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        <!-- List Header -->
        <div class="list-header">
            <div class="list-name">Your word list</div>
            <div class="list-meta">52 words • 12 mastered</div>
        </div>

        <!-- Search/Add Bar -->
        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                placeholder="Search or add words..."
            />
            <div class="search-hint">Type to search, press return to add</div>
        </div>

        <!-- Sort Controls -->
        <div class="sort-controls">
            <div class="sort-label">Sort by</div>
            <div class="sort-buttons">
                <button class="sort-button active">Mastery ↑</button>
                <button class="sort-button">Mastery ↓</button>
                <button class="sort-button">A–Z</button>
            </div>
        </div>

        <!-- Word List (sorted by mastery low to high by default) -->
        <div class="word-list">
            <!-- Lowest confidence first -->
            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                </div>
                <div class="word-text">adept</div>
            </div>

            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                </div>
                <div class="word-text">amiable</div>
            </div>

            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                </div>
                <div class="word-text">anachronism</div>
            </div>

            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                </div>
                <div class="word-text">belie</div>
            </div>

            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                </div>
                <div class="word-text">capricious</div>
            </div>

            <!-- Medium confidence -->
            <div class="word-item priority">
                <div class="confidence">
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                </div>
                <div class="word-text">adamant</div>
                <div class="priority-star">★</div>
            </div>

            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                </div>
                <div class="word-text">adroit</div>
            </div>

            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                </div>
                <div class="word-text">austere</div>
            </div>

            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                </div>
                <div class="word-text">benevolent</div>
            </div>

            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot"></div>
                    <div class="confidence-dot"></div>
                </div>
                <div class="word-text">cogent</div>
            </div>

            <!-- Higher confidence -->
            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot"></div>
                </div>
                <div class="word-text">abate</div>
            </div>

            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot"></div>
                </div>
                <div class="word-text">ambivalent</div>
            </div>

            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot filled"></div>
                    <div class="confidence-dot"></div>
                </div>
                <div class="word-text">candid</div>
            </div>

            <!-- Mastered words at the end -->
            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot mastered"></div>
                    <div class="confidence-dot mastered"></div>
                    <div class="confidence-dot mastered"></div>
                    <div class="confidence-dot mastered"></div>
                </div>
                <div class="word-text mastered">pervasive</div>
                <div class="checkmark">✓</div>
            </div>

            <div class="word-item">
                <div class="confidence">
                    <div class="confidence-dot mastered"></div>
                    <div class="confidence-dot mastered"></div>
                    <div class="confidence-dot mastered"></div>
                    <div class="confidence-dot mastered"></div>
                </div>
                <div class="word-text mastered">ubiquitous</div>
                <div class="checkmark">✓</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
